<!DOCTYPE html>
<html>
<head>
  <title>Select Treatment</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>Welcome to Spa</h1>
    <nav>
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('therapist') }}">Book Now</a>
      <a href="{{ url_for('admin') }}">Admin</a>
    </nav>
  </header>

  <div class="progress-container">
    <div class="progress-step {% if step == 1 %}active{% endif %}">1. Therapist</div>
    <div class="progress-step {% if step == 2 %}active{% endif %}">2. Treatment</div>
    <div class="progress-step {% if step == 3 %}active{% endif %}">3. Date & Time</div>
    <div class="progress-step {% if step == 4 %}active{% endif %}">4. Your Details</div>
    <div class="progress-step {% if step == 5 %}active{% endif %}">5. Payment</div>
  </div>

  <h2>Select Massage Type</h2>
  <form method="POST" action="{{ url_for('treatment') }}">
    {% for t in treatments %}
    <div class="card">
      <input type="radio" name="massage" value="{{ t.name }}" required>
      <label>{{ t.name }}{% if t.description %} – {{ t.description }}{% endif %}</label>
    </div>
    {% else %}
    <p>No treatments have been added yet. Please check back soon.</p>
    {% endfor %}
    <button type="submit">Continue</button>
  </form><br>

  <h3>Previously Selected:</h3>
    <ul>
      <li>Therapist: {{ therapist }}</li>
    </ul>


<a href="{{ url_for('therapist') }}" class="back-btn"> Back</a>
</body>
</html>
