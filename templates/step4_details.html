<!DOCTYPE html>
<html>
<head>
  <title>Your Details</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
    <h1>Welcome to Spa</h1>
    <nav>
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('treatment') }}">Book Now</a>
      <a href="{{ url_for('complaints') }}">Feedback</a>
    </nav>
  </header>
    <div class="progress-container">
        <div class="progress-step {% if step == 1 %}active{% endif %}">1. Treatment</div>
        <div class="progress-step {% if step == 2 %}active{% endif %}">2. Therapist</div>
        <div class="progress-step {% if step == 3 %}active{% endif %}">3. Date & Time</div>
        <div class="progress-step {% if step == 4 %}active{% endif %}">4. Your Details</div>
        <div class="progress-step {% if step == 5 %}active{% endif %}">5. Payment</div>
    </div>

  <h2>Enter Your Details</h2>
  <form method="POST" action="{{ url_for('details') }}">
    <input type="text" name="name" placeholder="Full Name" required><br>
    <input type="email" name="email" placeholder="Email"><br>
    <input type="tel" name="phone" placeholder="Phone Number" required><br>
    <button type="submit">Continue</button>
  </form>

  <h3>Previously Selected:</h3>
    <ul>
    <li>Massage: {{ massage }}</li>
    <li>Therapist: {{ therapist }}</li>
    <li>Date: {{ date }}</li>
    <li>Time: {{ time }}</li>
    </ul>

  <a href="{{ url_for('datetime') }}" class="back-btn">Back</a>
</body>
</html>
